                properties:
                  deadlines:
                    type: array
                    items: { $ref: "#/components/schemas/Deadline" }
                  total: { type: integer }
    post:
      tags: [Deadlines]
      operationId: createDeadline
      summary: Create a deadline reminder.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, title, dueDate]
              properties:
                userId: { type: string }
                title: { type: string }
                dueDate: { type: string, format: date-time }
                boardId: { type: [string, "null"] }
                issueId: { type: [string, "null"] }
                completed: { type: boolean }
      responses:
        "200":
          description: Created deadline.
          content:
            application/json:
              schema:
                type: object
                required: [deadline]
                properties:
                  deadline: { $ref: "#/components/schemas/Deadline" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/deadlines/{deadlineId}:
    patch:
      tags: [Deadlines]
      operationId: updateDeadline
      summary: Partial update for a deadline.
      parameters:
        - name: deadlineId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                title: { type: string }
                dueDate: { type: string, format: date-time }
                boardId: { type: [string, "null"] }
                issueId: { type: [string, "null"] }
                completed: { type: boolean }
      responses:
        "200":
          description: Updated deadline.
          content:
            application/json:
              schema:
                type: object
                required: [deadline]
                properties:
                  deadline: { $ref: "#/components/schemas/Deadline" }
        "400": { $ref: "#/components/responses/BadRequest" }
    delete:
      tags: [Deadlines]
      operationId: deleteDeadline
      summary: Delete a deadline by UUID.
      parameters:
        - name: deadlineId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deleted" }

  /api/deadlines/combined:
    get:
      tags: [Deadlines]
      operationId: listCombinedDeadlines
      summary: Deadlines and note deadlines merged into group/sub-item rows.
      parameters:
        - name: userId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Combined deadlines.
          content:
            application/json:
              schema:
                type: object
                required: [deadlines]
                properties:
                  deadlines:
                    type: array
                    items: { $ref: "#/components/schemas/CombinedDeadline" }

  /api/deadlines/upcoming:
    get:
      tags: [Deadlines]
      operationId: listUpcomingDeadlines
      summary: Deadlines due within the next N hours (default 24).
      parameters:
        - name: userId
          in: query
          schema: { type: string }
        - name: hours
          in: query
          schema:
            type: integer
            minimum: 1
            default: 24
      responses:
        "200":
          description: Upcoming deadlines.
          content:
            application/json:
              schema:
                type: object
                required: [deadlines, total]
                properties:
                  deadlines:
                    type: array
                    items: { $ref: "#/components/schemas/Deadline" }
                  total: { type: integer }

  /api/deadlines/available-watchlist:
    get:
      tags: [Deadlines]
      operationId: listAvailableWatchlist
      summary: Watchlist items eligible for batch-deadline creation.
      parameters:
        - name: excludeGroupId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Available watchlist items.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AvailableWatchlistItem" }

  /api/deadlines/batch:
    post:
      tags: [Deadlines]
      operationId: createBatchDeadlines
      summary: Create a `DeadlineGroup` with note and/or watchlist deadlines.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dueDate, title]
              properties:
                dueDate: { type: string, format: date-time }
                title: { type: string }
                userId: { type: string }
                noteIds:
                  type: array
                  items: { type: string, format: uuid }
                watchlistItems:
                  type: array
                  items:
                    type: object
                    required: [boardId, issueId]
                    properties:
                      boardId: { type: string }
                      issueId: { type: string }
      responses:
        "200":
          description: Batch created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchDeadlineResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/deadlines/groups/{groupId}:
    patch:
      tags: [Deadlines]
      operationId: updateDeadlineGroup
      summary: Update a deadline group's title, dueDate, or members.
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                title: { type: string }
                dueDate: { type: string, format: date-time }
                noteIds:
                  type: array
                  items: { type: string, format: uuid }
                watchlistItems:
                  type: array
                  items:
                    type: object
                    required: [boardId, issueId]
                    properties:
                      boardId: { type: string }
                      issueId: { type: string }
                userId: { type: string }
      responses:
        "200":
          description: Updated group.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeadlineGroupPatchResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Deadlines]
      operationId: deleteDeadlineGroup
      summary: |
        Delete a group. Synthetic IDs `standalone-deadline-{id}` and
        `standalone-note-{id}` are also accepted to clean up lone items.
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted group.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeadlineGroupDeleteResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------- Watchlist ----------------------------------------------
  /api/watchlist:
    get:
      tags: [Watchlist]
      operationId: listWatchlist
      summary: List watchlist entries (filter by boardId/userId).
      parameters:
        - $ref: "#/components/parameters/BoardIdQuery"
        - $ref: "#/components/parameters/UserIdQuery"
      responses:
        "200":
          description: Watchlist entries.
          content:
            application/json:
              schema:
                type: object
                required: [watchlist, total]
                properties:
                  watchlist:
                    type: array
                    items: { $ref: "#/components/schemas/Watchlist" }
                  total: { type: integer }
    post:
      tags: [Watchlist]
      operationId: upsertWatchlist
      summary: Add or update a watchlist entry (upsert).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [boardId, issueId, userId]
              properties:
                boardId: { type: string }
                issueId: { type: string }
                userId: { type: string }
                important: { type: boolean }
      responses:
        "200":
          description: Watchlist entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchlistToggleResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/watchlist/{issueId}/toggle-important:
    patch:
      tags: [Watchlist]
      operationId: toggleWatchlistImportant
      summary: |
        Flip the `important` flag for an issue. Creates the entry if
        missing (requires `boardId` and `userId` in the body).
      parameters:
        - name: issueId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                boardId: { type: string }
                userId: { type: string }
      responses:
        "200":
          description: Updated entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchlistToggleResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/watchlist/{issueId}:
    delete:
      tags: [Watchlist]
      operationId: deleteWatchlist
      summary: |
        Remove a watchlist entry. With no body, all entries for the issue
        are deleted; supplying `boardId`/`userId` scopes the deletion.
      parameters:
        - name: issueId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                boardId: { type: string }
                userId: { type: string }
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deleted" }

  # ---------- Activity -----------------------------------------------
  /api/activity/notifications:
    get:
      tags: [Activity]
      operationId: listNotifications
      summary: Activity notifications (filter by userId, read state).
      parameters:
        - name: userId
          in: query
          schema: { type: string }
        - name: read
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Notifications.
          content:
            application/json:
              schema:
                type: object
                required: [notifications, total]
                properties:
                  notifications:
                    type: array
                    items: { $ref: "#/components/schemas/ActivityNotification" }
                  total: { type: integer }
    delete:
      tags: [Activity]
      operationId: clearReadNotifications
      summary: Delete all read notifications for a user (or globally).
      parameters:
        - name: userId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Cleared.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: integer }

  /api/activity/notifications/{id}/read:
    patch:
      tags: [Activity]
      operationId: markNotificationRead
      summary: Mark a notification as read.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Updated notification.
          content:
            application/json:
              schema:
                type: object
                required: [notification]
                properties:
                  notification: { $ref: "#/components/schemas/ActivityNotification" }

  /api/activity/summary:
    get:
      tags: [Activity]
      operationId: getActivitySummary
      summary: Unread notifications, upcoming deadlines, important issues counts.
      parameters:
        - name: userId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Summary counts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivitySummary" }

  # ---------- Docs (self-documentation) ------------------------------
  /api/openapi.json:
    get:
      tags: [Docs]
      operationId: getOpenApiDocument
      summary: The OpenAPI 3.1 document describing this API.
      responses:
        "200":
          description: OpenAPI document.
          content:
            application/json: {}

  /api/docs:
    get:
      tags: [Docs]
      operationId: getSwaggerUi
      summary: Interactive Swagger UI for the API.
      responses:
        "200":
          description: Swagger UI HTML.
          content:
            text/html: {}

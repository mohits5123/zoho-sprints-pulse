  /api/projects/{id}/backlog-stats:
    get:
      tags: [Projects]
      operationId: getBacklogStats
      summary: Backlog summary, oldest items, and assignees.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/StaleDays"
        - $ref: "#/components/parameters/WatchedStates"
      responses:
        "200":
          description: Backlog stats.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BacklogStatsResponse" }

  # ---------- Sprints & burndown --------------------------------------
  /api/sprints:
    get:
      tags: [Sprints]
      operationId: listSprints
      summary: All known sprints.
      responses:
        "200":
          description: Sprints.
          content:
            application/json:
              schema:
                type: object
                required: [sprints, total]
                properties:
                  sprints:
                    type: array
                    items: { $ref: "#/components/schemas/Sprint" }
                  total: { type: integer }

  /api/sprints/debug/{projectId}:
    get:
      tags: [Sprints]
      operationId: debugSprint
      summary: |
        Live Zoho diagnostic dump for a project (status buckets, backlog
        and board counts). Makes live Zoho calls — bypasses the local-first
        cache. Intended for debugging only.
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Debug payload.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SprintDebugResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/sprints/{id}/display:
    patch:
      tags: [Sprints]
      operationId: setSprintDisplay
      summary: Hide or show a sprint.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                hidden: { type: boolean }
      responses:
        "200":
          description: Updated sprint.
          content:
            application/json:
              schema:
                type: object
                required: [sprint]
                properties:
                  sprint: { $ref: "#/components/schemas/Sprint" }

  /api/sprints/{sprintZohoId}/burndown:
    get:
      tags: [Burndown]
      operationId: getBurndown
      summary: |
        Daily burndown snapshots. When both `doneCount` and `totalCount`
        are supplied and `totalCount > 0`, today's snapshot is upserted
        before the list is returned.
      parameters:
        - name: sprintZohoId
          in: path
          required: true
          schema: { type: string }
        - name: doneCount
          in: query
          schema: { type: integer, minimum: 0 }
        - name: totalCount
          in: query
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Burndown snapshots.
          content:
            application/json:
              schema:
                type: object
                required: [snapshots]
                properties:
                  snapshots:
                    type: array
                    items: { $ref: "#/components/schemas/BurndownSnapshot" }
        "500": { $ref: "#/components/responses/ServerError" }

  # ---------- Issues --------------------------------------------------
  /api/issues/{issueId}:
    get:
      tags: [Issues]
      operationId: getIssue
      summary: Single issue by Zoho ID.
      parameters:
        - name: issueId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Issue detail.
          content:
            application/json:
              schema:
                type: object
                required: [issue]
                properties:
                  issue: { $ref: "#/components/schemas/IssueItem" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/issues/deleted:
    get:
      tags: [Issues]
      operationId: listDeletedIssues
      summary: Soft-deleted issues (deleted locally, missing from Zoho).
      responses:
        "200":
          description: Deleted-issue audit list.
          content:
            application/json:
              schema:
                type: object
                required: [issues]
                properties:
                  issues:
                    type: array
                    items: { $ref: "#/components/schemas/DeletedIssue" }

  # ---------- Notes ---------------------------------------------------
  /api/notes:
    get:
      tags: [Notes]
      operationId: listNotes
      summary: List notes (filter by userId/state).
      parameters:
        - name: userId
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string, enum: [active, closed] }
      responses:
        "200":
          description: Notes.
          content:
            application/json:
              schema:
                type: object
                required: [notes, total]
                properties:
                  notes:
                    type: array
                    items: { $ref: "#/components/schemas/Note" }
                  total: { type: integer }
    post:
      tags: [Notes]
      operationId: createNote
      summary: Create a note.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string }
                title: { type: string }
                content: { type: string }
                issueIds:
                  type: array
                  items: { type: string }
                taggedUserIds:
                  type: array
                  items: { type: string }
                state:
                  type: string
                  enum: [active, closed]
                deadline:
                  type: string
                  format: date-time
      responses:
        "200":
          description: Created note.
          content:
            application/json:
              schema:
                type: object
                required: [note]
                properties:
                  note: { $ref: "#/components/schemas/Note" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/notes/with-deadlines:
    get:
      tags: [Notes]
      operationId: listNotesWithDeadlines
      summary: Notes that have a deadline (optionally scoped to a user).
      parameters:
        - name: userId
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Notes with deadlines.
          content:
            application/json:
              schema:
                type: object
                required: [notes]
                properties:
                  notes:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/Note"
                        - type: object
                          required: [isOverdue]
                          properties:
                            isOverdue: { type: boolean }

  /api/notes/search-users:
    get:
      tags: [Notes]
      operationId: searchUsersForNoteMention
      summary: Search users for @mentions (case-sensitive substring).
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: User matches.
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/UserSearchHit" }

  /api/notes/search-issues:
    get:
      tags: [Notes]
      operationId: searchIssuesForNoteLink
      summary: Search issues for note linking (case-sensitive substring).
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/BoardIdQuery"
      responses:
        "200":
          description: Issue matches.
          content:
            application/json:
              schema:
                type: object
                properties:
                  issues:
                    type: array
                    items: { $ref: "#/components/schemas/IssueSearchHit" }

  /api/notes/{noteId}:
    get:
      tags: [Notes]
      operationId: getNote
      summary: Fetch a note by UUID.
      parameters:
        - name: noteId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Note.
          content:
            application/json:
              schema:
                type: object
                required: [note]
                properties:
                  note: { $ref: "#/components/schemas/Note" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Notes]
      operationId: updateNote
      summary: Partial update for a note.
      parameters:
        - name: noteId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                title: { type: string }
                content: { type: string }
                issueIds:
                  type: array
                  items: { type: string }
                taggedUserIds:
                  type: array
                  items: { type: string }
                state:
                  type: string
                  enum: [active, closed]
                deadline:
                  type: [string, "null"]
                  format: date-time
                deadlineNotified: { type: boolean }
      responses:
        "200":
          description: Updated note.
          content:
            application/json:
              schema:
                type: object
                required: [note]
                properties:
                  note: { $ref: "#/components/schemas/Note" }
        "400": { $ref: "#/components/responses/BadRequest" }
    delete:
      tags: [Notes]
      operationId: deleteNote
      summary: Delete a note. Refuses if the note still has a deadline.
      parameters:
        - name: noteId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deleted" }
        "400": { $ref: "#/components/responses/BadRequest" }


          in: query
          schema: { type: string, enum: [todo, doing, done] }
        - name: epicId
          in: query
          schema: { type: string }
        - name: userId
          in: query
          schema: { type: string }
        - name: creatorOnly
          in: query
          schema: { type: boolean }
        - name: stale
          in: query
          schema: { type: boolean }
        - $ref: "#/components/parameters/StaleDays"
